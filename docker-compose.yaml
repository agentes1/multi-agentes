services:
  db:
    image: postgres:15
    container_name: db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=odoo
    volumes:
      - odoo-db:/var/lib/postgresql/data
    restart: always

  odoo:
    image: odoo:latest
    container_name: odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    tty: true # Mimics -t flag
    volumes:
      - odoo-data:/var/lib/odoo
      # Mounts odoo_integration to /mnt/extra-addons as per docs
      - ./odoo_integration:/mnt/extra-addons
    environment:
      - HOST=db
      - USER=admin
      - PASSWORD=admin
    links:
      - db:db
    restart: always

volumes:
  odoo-db:
  odoo-data:
