services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ${HOME:-${USERPROFILE}}/.ollama:/root/.ollama

  ollama-init:
    image: curlimages/curl:latest
    container_name: ollama-init
    depends_on:
      - ollama
    env_file:
      - ./shared/.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        MODEL=$${OLLAMA_MODEL:-qwen3:4b}

        until curl -sf http://ollama:11434/ > /dev/null 2>&1; do
          echo "[ollama-init] Esperando al servidor Ollama..."
          sleep 3
        done

        PRESENT=$(curl -sf http://ollama:11434/api/tags | grep -c "\"$${MODEL}\"" || true)

        if [ "$${PRESENT}" -gt 0 ]; then
          echo "[ollama-init] Modelo $${MODEL} disponible. OK."
        else
          echo "[ollama-init] ERROR: el modelo $${MODEL} no está en la caché montada ~/.ollama."
          echo "[ollama-init] Descárgalo primero en el host con: ollama pull $${MODEL}"
          exit 1
        fi
    restart: "no"

  assistant-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assistant-backend
    depends_on:
      db:
        condition: service_started
      web:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    env_file:
      - ./shared/.env
    environment:
      URL: http://web:8069/xmlrpc/2
      DB: ${ODOO_DB:-odoo}
      USERNAME: ${ODOO_USERNAME:-odoo}
      PASSWORD: ${ODOO_PASSWORD:-multi-agente-agentes1}

      ODOO_BASE_URL: http://web:8069/xmlrpc/2
      ODOO_DB: ${ODOO_DB:-odoo}
      ODOO_USERNAME: ${ODOO_USERNAME:-odoo}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-multi-agente-agentes1}

      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0}

      MODEL_INTAKE_AGENT: ${MODEL_INTAKE_AGENT:-}
      MODEL_BUDGET_AGENT: ${MODEL_BUDGET_AGENT:-}
      MODEL_GENERAL_AGENT: ${MODEL_GENERAL_AGENT:-}
      MODEL_EVAL_JUDGE: ${MODEL_EVAL_JUDGE:-}
    volumes:
      - .:/app

  web:
    image: odoo:18.0
    container_name: odoo-web
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${ODOO_PASSWORD:-multi-agente-agentes1}

      HELP_DESK_VIRTUAL_ASSISTANT_TICKET_ENTRY_URL: http://assistant-backend:8000/assistant/ticket-entry
      HELP_DESK_VIRTUAL_ASSISTANT_DISCUSS_MESSAGE_URL: http://assistant-backend:8000/assistant/discuss-message
      HELP_DESK_VIRTUAL_ASSISTANT_BUDGET_FROM_TICKET_URL: http://assistant-backend:8000/assistant/budget-from-ticket
      HELP_DESK_VIRTUAL_ASSISTANT_SALES_FROM_TICKET_URL: http://assistant-backend:8000/assistant/sales-from-ticket
      MAIL_INBOX_INPUT_BACKEND_INCOMING_EMAIL_URL: http://assistant-backend:8000/assistant/incoming-email

  db:
    image: postgres:15
    container_name: odoo-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_PASSWORD:-multi-agente-agentes1}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata

volumes:
  odoo-web-data:
  odoo-db-data:
