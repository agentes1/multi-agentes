# ── Definición del proyecto ─────────────────────────────────────────
[project]
name = "multi-agentes"
version = "0.1.0"
requires-python = ">=3.13,<3.14"


# ── Configuración de setuptools ─────────────────────────────────────
[tool.setuptools.packages.find]
include = ["agents*", "odoo*", "orchestration*", "routing*", "shared*", "services*", "schemas*"]


# ── Ruff: linter y formateador ────────────────────────────────────────────────
[tool.ruff]
line-length = 100        # máximo de caracteres por línea
target-version = "py313" # versión mínima de Python objetivo
force-exclude = true     # respeta los excludes aunque se pase el fichero explícitamente

[tool.ruff.lint]
select = [
    "E",   # errores de estilo PEP8
    "F",   # errores de lógica (variables no usadas, imports no usados, etc)
    "I",   # orden de imports (isort)
    "B",   # bugbear: patrones comunes que causan bugs
    "UP",  # modernización de sintaxis Python (pyupgrade)
    "SIM", # simplificación de código innecesariamente complejo
]
ignore = [
    "E501", # longitud de línea: ya la controla line-length arriba
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "schemas", "services", "shared", "routing"]

[tool.ruff.format]
quote-style = "double" # comillas dobles en strings
indent-style = "space" # espacios en vez de tabs
line-ending = "lf"     # saltos de línea Unix (evita problemas en Windows/Mac)


# ── Mypy: comprobación estática de tipos ──────────────────────────────────────
[tool.mypy]
python_version = "3.13"
warn_return_any = true        # avisa si una función devuelve Any implícitamente
warn_unused_configs = true    # avisa si hay opciones de mypy que no hacen nada
disallow_untyped_defs = true  # obliga a tipar todos los argumentos y returns
no_implicit_optional = true   # x: str = None debe escribirse como x: str | None = None
check_untyped_defs = true     # comprueba también funciones sin anotaciones
pretty = true                 # output más legible en terminal
exclude = [
    "^tests/",   # los tests no se comprueban con mypy
    "^build/",   # carpeta de build generada automáticamente
    "^dist/",    # carpeta de distribución generada automáticamente
]


# ── Pytest: configuración de tests ────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"                    # todos los tests async se ejecutan sin decorador explícito
testpaths = ["tests"]                    # carpeta donde pytest busca tests
python_files = ["test_*.py"]            # patrón de ficheros de test
python_functions = ["test_*"]           # patrón de funciones de test
pythonpath = ["."]
markers = [
    "integration: tests de integración contra Odoo real",
]
