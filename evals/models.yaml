# Models to include in the benchmark
# Add or comment out lines to change what gets tested.
# Run: python -m evals.run_multi_model_eval
#
# To install a model locally: ollama pull <name>
# Full list of available models: https://ollama.com/library

models:
  - mistral           # Mistral 7B (4.4 GB) — strong reasoning
  - llama3.2          # Meta Llama 3.2 3B (2.0 GB) — lightweight
  - qwen3:4b          # Qwen 3 4B (2.5 GB) — fast, good quality
  - gemma3:4b         # Gemma 3 4B (3.3 GB) — Google

